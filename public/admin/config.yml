backend:
  name: github
  repo: ideas4lego/ideas4lego.github.io
  branch: main
  base_url: https://ideas4lego-cms-oauth.ideas4lego.workers.dev
  auth_endpoint: auth

# Транслитерация кириллицы в имена файлов (slug), чтобы заголовки на
# русском не создавали файлы с русскими именами.
slug:
  encoding: "ascii"
  clean_accents: true

# Показывать превью сайта прямо в CMS
site_url: https://ideas4lego.github.io
display_url: https://ideas4lego.github.io

media_folder: "public/uploads"
public_folder: "/uploads"

# Локализация интерфейса CMS на русский
locale: "ru"

collections:
  - name: "builds"
    label: "Постройки"
    label_singular: "Постройка"
    folder: "src/content/builds"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Название постройки", name: "title", widget: "string" }
      - { label: "Дата", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Фото", name: "image", widget: "image", required: false }
      - { label: "Описание фото", name: "imageAlt", widget: "string", required: false }
      - { label: "Краткое описание (для карточки)", name: "excerpt", widget: "text", required: false }
      - { label: "Количество деталей", name: "pieceCount", widget: "number", required: false, value_type: "int" }
      - { label: "Время сборки (минут)", name: "timeMinutes", widget: "number", required: false, value_type: "int" }
      - label: "Сложность"
        name: "difficulty"
        widget: "select"
        default: "Легко"
        options: ["Легко", "Средне", "Сложно"]
      - label: "Цвет карточки"
        name: "accentColor"
        widget: "select"
        default: "brick"
        options:
          - { label: "Красный", value: "brick" }
          - { label: "Голубой", value: "sky" }
          - { label: "Зелёный", value: "grass" }
          - { label: "Жёлтый", value: "sun" }
          - { label: "Фиолетовый", value: "grape" }
      - { label: "Подробный рассказ о постройке", name: "body", widget: "markdown" }
      - { label: "Черновик (не публиковать)", name: "draft", widget: "boolean", default: false }

  - name: "videos"
    label: "Видео"
    label_singular: "Видео"
    folder: "src/content/videos"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title"]
    fields:
      - { label: "Название видео", name: "title", widget: "string" }
      - { label: "Дата", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - label: "Ссылка на YouTube"
        name: "youtubeUrl"
        widget: "string"
        hint: "Например https://www.youtube.com/watch?v=XXXXXXXXXXX"
      - label: "Своя картинка-превью (необязательно)"
        name: "thumbnail"
        widget: "image"
        required: false
        hint: "Если не загрузить — возьмётся превью с самого YouTube"
      - { label: "Длительность", name: "duration", widget: "string", required: false, hint: "Например 08:12" }
      - { label: "Просмотры (текстом)", name: "views", widget: "string", required: false, hint: "Например «24 тыс. просмотров»" }
      - { label: "Краткое описание (для карточки)", name: "excerpt", widget: "text", required: false }
      - label: "Цвет карточки"
        name: "accentColor"
        widget: "select"
        default: "sun"
        options:
          - { label: "Красный", value: "brick" }
          - { label: "Голубой", value: "sky" }
          - { label: "Зелёный", value: "grass" }
          - { label: "Жёлтый", value: "sun" }
          - { label: "Фиолетовый", value: "grape" }
      - { label: "Описание на странице видео", name: "body", widget: "markdown", required: false }
      - { label: "Черновик (не публиковать)", name: "draft", widget: "boolean", default: false }

  - name: "gallery"
    label: "Фотогалерея"
    label_singular: "Фото"
    folder: "src/content/gallery"
    create: true
    delete: true
    slug: "photo-{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"
    identifier_field: tag
    summary: "{{tag}}"
    fields:
      - { label: "Фото", name: "image", widget: "image" }
      - { label: "Подпись", name: "tag", widget: "string" }
      - { label: "Дата", name: "date", widget: "datetime", format: "YYYY-MM-DD" }

  - name: "pages"
    label: "Страницы"
    label_singular: "Страница"
    folder: "src/content/pages"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}}"
    fields:
      - { label: "Заголовок", name: "title", widget: "string" }
      - { label: "Картинка", name: "image", widget: "image", required: false }
      - label: "Показывать в меню сайта"
        name: "showInMenu"
        widget: "boolean"
        default: true
      - label: "Порядок в меню (меньше число — левее)"
        name: "menuOrder"
        widget: "number"
        default: 0
        required: false
      - { label: "Текст", name: "body", widget: "markdown" }
